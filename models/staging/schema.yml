version: 2

models:
  - name: stg_olist_raw__orders
    description: "Cleaned orders header data. Grain: 1 row per order_id."
    columns:
      - name: order_id
        description: "Primary key for orders."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_olist_raw__customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_raw__customers')
                field: customer_id
      - name: order_status
        description: "Current lifecycle status of the order."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: stg_olist_raw__order_items
    description: "Individual line items within an order. Grain: 1 row per order_id + order_item_id."
    columns:
      - name: order_id
        description: "Foreign key to stg_olist_raw__orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_raw__orders')
                field: order_id
      - name: order_item_id
        description: "Sequential number identifying item count within the same order."
        data_tests:
          - not_null
      - name: product_id
        description: "Foreign key to stg_olist_raw__products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_raw__products')
                field: product_id
      - name: seller_id
        description: "Foreign key to stg_olist_raw__sellers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_raw__sellers')
                field: seller_id

  - name: stg_olist_raw__customers
    description: "Customer profiles and standardized city/state locations. Grain: 1 row per customer_id."
    columns:
      - name: customer_id
        description: "Order-specific customer key (primary key for orders join)."
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "True unique identifier for a customer across multiple orders."
        data_tests:
          - not_null

  - name: stg_olist_raw__products
    description: "Product catalog with dimensions and Portuguese category names. Grain: 1 row per product_id."
    columns:
      - name: product_id
        description: "Primary key for products."
        data_tests:
          - unique
          - not_null

  - name: stg_olist_raw__sellers
    description: "Seller profiles and standardized city/state locations. Grain: 1 row per seller_id."
    columns:
      - name: seller_id
        description: "Primary key for sellers."
        data_tests:
          - unique
          - not_null

  - name: stg_olist_raw__order_payments
    description: "Payment methods and installment details per order. Grain: 1 row per order_id + payment_sequential."
    columns:
      - name: order_id
        description: "Foreign key to stg_olist_raw__orders."
        data_tests:
          - not_null
      - name: payment_sequential
        description: "Sequence number for multiple payment methods on a single order."
        data_tests:
          - not_null

  - name: stg_olist_raw__order_reviews
    description: "Deduplicated customer reviews. Grain: 1 row per review_id."
    columns:
      - name: review_id
        description: "Primary key for deduplicated reviews."
        data_tests:
          - not_null
      - name: order_id
        description: "Foreign key to stg_olist_raw__orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_raw__orders')
                field: order_id
      - name: review_score
        description: "Customer satisfaction score from 1 (worst) to 5 (best)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist_raw__product_category_name
    description: "Lookup table mapping Portuguese category names to English."
    columns:
      - name: category_name
        description: "Primary key (Portuguese category name)."
        data_tests:
          - unique
          - not_null

  - name: stg_olist_raw__geolocation
    description: "Brazilian zip code prefix coordinates. Contains multiple lat/lng points per zip code prefix."
    columns:
      - name: zip_code_prefix
        description: "First 5 digits of the Brazilian zip code."
        data_tests:
          - not_null